# Example Configuration for EdgeCascade
# Customize your local endpoints, cloud providers, and routing thresholds.

server:
  host: "0.0.0.0"
  port: 8080
  workers: 1
  log_level: "info"
  api_key: ""  # Optional authentication token

privacy_gate:
  enabled: true
  enforce_local_only: true
  detect_pii: true
  detect_secrets: true
  detect_code_secrets: true
  mask_in_logs: true

complexity_scorer:
  tier_1_max_threshold: 0.35
  tier_2_max_threshold: 0.70
  weights:
    length: 0.15
    reasoning_markers: 0.35
    code_complexity: 0.20
    semantic_similarity: 0.30

tiers:
  tier_1:
    name: "Edge Local SLM"
    description: "Fast local models for classification, structured extraction, summarization, and boilerplate."
    primary_provider: "ollama"
    primary_model: "llama3.2:1b"
    fallback_provider: "ollama"
    fallback_model: "llama3.1:8b"
    max_latency_ms: 3000

  tier_2:
    name: "Mid-tier Reasoner"
    description: "Balanced local or economical models for multi-turn chat and standard programming."
    primary_provider: "ollama"
    primary_model: "llama3.1:8b"
    fallback_provider: "openai"
    fallback_model: "gpt-4o-mini"
    max_latency_ms: 8000

  tier_3:
    name: "Frontier Cloud"
    description: "High-capability frontier cloud models for ambiguous logic, architecture design, and deep math."
    primary_provider: "openai"
    primary_model: "gpt-4o"
    fallback_provider: "anthropic"
    fallback_model: "claude-3-5-sonnet-20241022"
    max_latency_ms: 25000

circuit_breaker:
  failure_threshold: 3
  recovery_timeout_seconds: 30.0
  half_open_max_trials: 2
  latency_threshold_ms: 10000.0

quality_guard:
  enabled: true
  min_tokens: 2
  repetition_check: true
  max_repetition_ratio: 0.40
  refusal_check: true

providers:
  ollama:
    type: "ollama"
    base_url: "http://host.docker.internal:11434"
    timeout_seconds: 90.0
    max_retries: 2

  vllm:
    type: "vllm"
    base_url: "http://localhost:8000/v1"
    api_key: ""
    timeout_seconds: 30.0
    max_retries: 2

  openai:
    type: "openai"
    base_url: "https://api.openai.com/v1"
    api_key: "${OPENAI_API_KEY}"
    timeout_seconds: 45.0
    max_retries: 2

  anthropic:
    type: "anthropic"
    base_url: "https://api.anthropic.com/v1"
    api_key: "${ANTHROPIC_API_KEY}"
    timeout_seconds: 45.0
    max_retries: 2

  gemini:
    type: "gemini"
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    api_key: "${GEMINI_API_KEY}"
    timeout_seconds: 45.0
    max_retries: 2

  mock:
    type: "mock"
    latency_ms: 5

cost_metrics:
  benchmark_frontier_model: "gpt-4o"
  rates_per_million_tokens:
    "gpt-4o":
      input: 2.50
      output: 10.00
    "claude-3-5-sonnet-20241022":
      input: 3.00
      output: 15.00
    "gemini-1.5-pro":
      input: 3.50
      output: 10.50
    "gpt-4o-mini":
      input: 0.15
      output: 0.60
    "llama3.1:8b":
      input: 0.00
      output: 0.00
    "llama3.2:1b":
      input: 0.00
      output: 0.00
    "qwen2.5:7b-instruct":
      input: 0.00
      output: 0.00
